name: Feature request
description: Suggest an improvement for OzAmp
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like OzAmp to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
    validations:
      required: true
