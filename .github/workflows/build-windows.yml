name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure LLVM tools
        shell: powershell
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Build OzAmp
        shell: cmd
        run: build_windows_llvm.bat

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\OzAmp-1.0.0.exe)) { throw "OzAmp executable missing" }
          Get-FileHash .\OzAmp-1.0.0.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: OzAmp-1.0.0-windows-x64
          path: OzAmp-1.0.0.exe
