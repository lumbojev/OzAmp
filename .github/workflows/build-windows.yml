name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_spotify.py
      - run: python3 tests/test_workspace.py
      - run: python3 tests/test_workspace_state.py
      - run: python3 tests/test_resources.py

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure LLVM tools
        shell: powershell
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Build OzAmp
        shell: cmd
        run: build_windows_llvm.bat

      - name: Test saved Spotify session (offline DPAPI integration)
        shell: cmd
        run: tests\build_windows_tests.bat

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path .\OzAmp-1.0.2.exe)) { throw "OzAmp executable missing" }
          python tools/verify_exe.py OzAmp-1.0.2.exe
          if ($LASTEXITCODE -ne 0) { throw "OzAmp embedded metadata verification failed" }
          $version = (Get-Item .\OzAmp-1.0.2.exe).VersionInfo
          if ($version.FileVersion -ne '1.0.2' -or $version.ProductVersion -ne '1.0.2') { throw "Windows version resource mismatch" }
          Get-FileHash .\OzAmp-1.0.2.exe -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: OzAmp-1.0.2-windows-x64
          path: OzAmp-1.0.2.exe
